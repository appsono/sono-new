name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - run: dart run scripts/compute_translation_progress.dart
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - run: dart run scripts/compute_translation_progress.dart
      - run: flutter test

  build-android-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - run: dart run scripts/compute_translation_progress.dart
      - name: Write env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -n "$ENV_JSON" ]; then
            printf '%s' "$ENV_JSON" > env.json
          else
            cp env.example.json env.json
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env.json
