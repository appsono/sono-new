name: Build iOS (unsigned)

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - run: dart run scripts/compute_translation_progress.dart

      - name: Write env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: printf '%s' "${ENV_JSON:-$(cat env.example.json)}" > env.json

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r sono-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: sono-ios-unsigned
          path: sono-unsigned.ipa
